<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW NAVIGATION · 禁忌之海</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 极致诱惑的暗黑背景 + 透视度极高的模糊背景图 */
            background: radial-gradient(circle at center, rgba(20, 20, 30, 0.5) 0%, #050508 100%), 
                        url('images21.jpg'); /* 使用你提供的原图作为背景 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* 增加透明度滤镜，使背景图更“不明显”且透出底色 */
            backdrop-filter: brightness(0.3) blur(5px); 
            -webkit-backdrop-filter: brightness(0.3) blur(5px);

            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            /* 隐藏浏览器原生滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* 顶部霓虹标题 */
        .header-title {
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.6);
            text-transform: uppercase;
            pointer-events: none; /* 防止遮挡点击 */
            margin-top: 60px; /* 为手机状态栏留出空间 */
        }

        .container {
            width: 100%;
            max-width: 600px; /* 限制在手机上的最大宽度 */
            padding: 0 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px; /* 卡片间距 */
            padding-bottom: 40px;
        }

        /* 单个导航位卡片：超高透明度玻璃拟态 + 霓虹发光 */
        .nav-card {
            /* 关键：极低的背景透明度 (0.15) */
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(20px); /* 强力毛玻璃效果 */
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            height: 140px; /* 固定高度让四个条目更紧凑 */
        }

        /* 卡片内部图标/序号 */
        .card-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
            transition: transform 0.3s ease;
        }

        .nav-card h2 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
            color: #fff;
            font-weight: 600;
        }

        .nav-card p {
            font-size: 0.8rem;
            color: #b0b0c0;
            transition: color 0.3s ease;
            line-height: 1.4;
        }

        /* 悬停时的“色色”霓虹爆发效果 */
        .nav-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 0, 127, 0.5);
            box-shadow: 0 10px 30px -10px rgba(255, 0, 127, 0.5),
                        inset 0 0 20px rgba(255, 0, 127, 0.1);
            background: rgba(255, 255, 255, 0.1); /* 悬停时稍微不透明一点点 */
        }

        .nav-card:hover p {
            color: #ff99cc;
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1);
        }

        /* 底部安全小标语 */
        .footer-tip {
            margin-top: 30px;
            font-size: 0.6rem;
            color: #5a5a6e;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* 针对 iPhone 安全区域的适配 */
        @supports (padding: env(safe-area-inset-bottom)) {
            .container {
                padding-bottom: env(safe-area-inset-bottom);
            }
            .header-title {
                margin-top: calc(60px + env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>

    <h1 class="header-title">// SECURE ACCESS //</h1>
    
    <div class="container">
        <a href="https://example1.com" target="_blank" class="nav-card">
            <span class="card-icon">💋</span>
            <h2>SENSORY HUB 01</h2>
            <p>沉浸式感官体验空间<br>探索未知边界</p>
        </a>

        <a href="https://example2.com" target="_blank" class="nav-card">
            <span class="card-icon">🔥</span>
            <h2>PHANTOM NODE 02</h2>
            <p>欲望交织的暗网节点<br>解码私人秘密</p>
        </a>

        <a href="https://example3.com" target="_blank" class="nav-card">
            <span class="card-icon">🖤</span>
            <h2>VOID 03</h2>
            <p>绝对私密的虚无禁区<br>掌控一切的快感</p>
        </a>

        <a href="https://example4.com" target="_blank" class="nav-card">
            <span class="card-icon">🍷</span>
            <h2>ECLIPSE 04</h2>
            <p>月蚀时刻的极乐盛宴<br>尊享特权访问</p>
        </a>
    </div>

    <div class="footer-tip">
        Encrypted Connection · Secured by Obscura Protocol
    </div>

</body>
</html>
