<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW NAVIGATION · 禁忌之海</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 替换为你的背景图片路径，并加入半透明暗色遮罩让文字更清晰 */
            background: linear-gradient(rgba(5, 5, 8, 0.75), rgba(5, 5, 8, 0.85)), url('images21.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景光晕装饰 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 127, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 40px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.6), 0 0 20px rgba(255, 0, 127, 0.4);
            text-transform: uppercase;
        }

        /* 三个位置的卡片容器 */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 单个导航位卡片：玻璃拟态 + 霓虹发光 */
        .nav-card {
            background: rgba(18, 18, 26, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 20px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(10px);
        }

        /* 卡片内部图标/序号 */
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
            filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.5));
        }

        .nav-card h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #fff;
        }

        .nav-card p {
            font-size: 0.9rem;
            color: #8a8a9e;
            transition: color 0.3s ease;
        }

        /* 悬停时的霓虹效果 */
        .nav-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 0, 127, 0.6);
            box-shadow: 0 10px 30px -10px rgba(255, 0, 127, 0.4),
                        inset 0 0 20px rgba(255, 0, 127, 0.1);
        }

        .nav-card:hover p {
            color: #ff75b3;
        }

        /* 底部安全小标语 */
        .footer-tip {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #4a4a5e;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>更多资源:828.cx</h1>
        
        <div class="nav-grid">
            <!-- 位置一 -->
            <a href="https://example1.com" target="_blank" class="nav-card">
                <span class="card-icon">💋</span>
                <h2>SENSORY 01</h2>
                <p>探索极乐与秘密的沉浸式边界</p>
            </a>

            <!-- 位置二 -->
            <a href="https://example2.com" target="_blank" class="nav-card">
                <span class="card-icon">🔥</span>
                <h2>PHANTOM 02</h2>
                <p>欲望交织的暗网节点与枢纽</p>
            </a>

            <!-- 位置三 -->
            <a href="https://example3.com" target="_blank" class="nav-card">
                <span class="card-icon">🍷</span>
                <h2>ECLIPSE 03</h2>
                <p>私密、虚无与绝对掌控的禁区</p>
            </a>
        </div>

        <div class="footer-tip">
            Encrypted Connection · Secured by Shadow Sentinel
        </div>
    </div>

</body>
</html>
