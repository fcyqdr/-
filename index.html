<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW NAVIGATION · 禁忌之海</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 调整点：减弱了黑色渐变遮罩，让背景图更加清晰显露 */
            background: radial-gradient(circle at center, rgba(10, 10, 20, 0.2) 0%, rgba(5, 5, 8, 0.4) 100%), 
                        url('images21.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* 调整点：降低了模糊度和亮度压制，让背景图更通透、更清晰 */
            backdrop-filter: brightness(0.7) blur(2px); 
            -webkit-backdrop-filter: brightness(0.7) blur(2px);

            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* 顶部霓虹标题 */
        .header-title {
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.6);
            text-transform: uppercase;
            pointer-events: none;
            margin-top: 60px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        /* 单个导航位卡片 */
        .nav-card {
            /* 调整点：稍微增加卡片背景的暗色半透明度，保证在亮背景下文字依然清晰可读 */
            background: rgba(15, 15, 25, 0.45); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px 20px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            height: 140px;
        }

        /* 卡片内部图标/序号 */
        .card-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
            transition: transform 0.3s ease;
        }

        .nav-card h2 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
            color: #fff;
            font-weight: 600;
        }

        .nav-card p {
            font-size: 0.8rem;
            color: #d0d0e0; /* 调亮了副标题文字颜色，适应更清晰的背景 */
            transition: color 0.3s ease;
            line-height: 1.4;
        }

        /* 悬停时的霓虹爆发效果 */
        .nav-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 0, 127, 0.7);
            box-shadow: 0 10px 30px -10px rgba(255, 0, 127, 0.6),
                        inset 0 0 20px rgba(255, 0, 127, 0.15);
            background: rgba(25, 25, 40, 0.6);
        }

        .nav-card:hover p {
            color: #ff99cc;
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1);
        }

        /* 底部安全小标语 */
        .footer-tip {
            margin-top: 30px;
            font-size: 0.6rem;
            color: #8a8a9e; /* 调亮底部提示文字 */
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 针对 iPhone 安全区域的适配 */
        @supports (padding: env(safe-area-inset-bottom)) {
            .container {
                padding-bottom: env(safe-area-inset-bottom);
            }
            .header-title {
                margin-top: calc(60px + env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>

    <h1 class="header-title">快乐的咸湿佬</h1>
    
    <div class="container">
        <a href="https://example1.com" target="_blank" class="nav-card">
            <span class="card-icon">💋</span>
            <h2>SENSORY HUB 01</h2>
            <p>沉浸式感官体验空间<br>探索未知边界</p>
        </a>

        <a href="https://example2.com" target="_blank" class="nav-card">
            <span class="card-icon">🔥</span>
            <h2>PHANTOM NODE 02</h2>
            <p>欲望交织的暗网节点<br>解码私人秘密</p>
        </a>

        <a href="https://example3.com" target="_blank" class="nav-card">
            <span class="card-icon">🖤</span>
            <h2>VOID 03</h2>
            <p>绝对私密的虚无禁区<br>掌控一切的快感</p>
        </a>

        <a href="https://example4.com" target="_blank" class="nav-card">
            <span class="card-icon">🍷</span>
            <h2>ECLIPSE 04</h2>
            <p>月蚀时刻的极乐盛宴<br>尊享特权访问</p>
        </a>
    </div>

    <div class="footer-tip">
        Encrypted Connection · Secured by Obscura Protocol
    </div>

</body>
</html>
